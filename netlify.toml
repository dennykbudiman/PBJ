[build]
  # The release check stops a build that would point Axle v2 at the old v1 database, or the live site at staging.
  command = "node scripts/check-release.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Previews and branch builds talk to the STAGING Supabase project ("Axle v2 staging"). These values are public by
# design (the anon key only works through the database's access rules) and override the Netlify UI, so a preview can
# never reach live data.
#
# Release setting: production builds take VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY from the site's environment
# variables (Netlify → Site configuration → Environment variables). Before Axle v2 goes onto the live site, set those
# to the PRODUCTION Supabase project; scripts/check-release.mjs refuses the build while they still point at the v1
# database or at staging.

[context.deploy-preview.environment]
  VITE_SUPABASE_URL = "https://wuwabhwvnzhlcctxwpda.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1d2FiaHd2bnpobGNjdHh3cGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODI0MTAsImV4cCI6MjEwNjc1ODQxMH0.cXKhovsB-JYtO5ubGi3Nxnp8WMuCYXkqalzdChcnK7g"

[context.branch-deploy.environment]
  VITE_SUPABASE_URL = "https://wuwabhwvnzhlcctxwpda.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1d2FiaHd2bnpobGNjdHh3cGRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODI0MTAsImV4cCI6MjEwNjc1ODQxMH0.cXKhovsB-JYtO5ubGi3Nxnp8WMuCYXkqalzdChcnK7g"

# The same safety headers as the self-hosted setup (deploy/self-host/web/Caddyfile).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Built files have a fingerprint in their name, so browsers can keep them for a year.
# Repeat visits then download almost nothing, which keeps Netlify bandwidth use low.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side routing: every path falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
