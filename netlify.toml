[build]
  # The release check stops a build that would point Axle v2 at the old v1 database, or the live site at staging.
  command = "node scripts/check-release.mjs && npm run build && node scripts/write-headers.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Previews and branch builds talk to the STAGING Supabase project ("Axle v2 staging"). These values are public by
# design (the publishable key only works through the database's access rules) and override the Netlify UI, so a
# preview can never reach live data. VITE_SUPABASE_ANON_KEY holds the project's publishable key (sb_publishable_…);
# Supabase retires the old JWT "anon" keys by the end of 2026.
#
# Release setting: production builds take VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY from the site's environment
# variables (Netlify → Site configuration → Environment variables). Before Axle v2 goes onto the live site, set those
# to the PRODUCTION Supabase project's address and publishable key; scripts/check-release.mjs refuses the build while
# they still point at the v1 database or at staging, or the key is a secret key or another project's key.

[context.deploy-preview.environment]
  VITE_SUPABASE_URL = "https://wuwabhwvnzhlcctxwpda.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_-_zjjaw1WoAoLOFVy6MsZQ_JYmVpITy"

[context.branch-deploy.environment]
  VITE_SUPABASE_URL = "https://wuwabhwvnzhlcctxwpda.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_-_zjjaw1WoAoLOFVy6MsZQ_JYmVpITy"

# The same safety headers as the self-hosted setup (deploy/self-host/web/Caddyfile).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # The Content-Security-Policy (own code, Google Fonts, and only this build's Supabase project) is written to
    # dist/_headers by scripts/write-headers.mjs after each build, because the project address differs per build.
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Built files have a fingerprint in their name, so browsers can keep them for a year.
# Repeat visits then download almost nothing, which keeps Netlify bandwidth use low.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side routing: every path falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
